[server]
enableServerGeneration = true
maxGenerationRequestDistance = 2048
maxSyncOnLoadRequestDistance = 2048
generationRequestRateLimit = 4
syncOnLoadRateLimit = 12
realTimeUpdateDistanceRadiusInChunks = 64
playerBandwidthLimit = 500

[common.multiThreading]
numberOfThreads = 4
threadRunTimeRatio = "0.65"
threadPriority = 5

[common.worldGenerator]
enableDistantGeneration = true

[client.advanced.graphics.quality]
lodChunkRenderDistanceRadius = 128
verticalQuality = "MEDIUM"
horizontalQuality = "MEDIUM"
lodBiomeBlending = 3
transparency = "COMPLETE"
