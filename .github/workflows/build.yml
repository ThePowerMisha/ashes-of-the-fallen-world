name: Validate and package CurseForge
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate quest and script files
        run: python tools/build.py
      - name: Validate source
        run: python tools/validate.py
      - name: Check generated files are committed
        run: git diff --exit-code
      - name: Validate and package
        run: |
          mkdir -p dist
          python tools/package.py dist/Ashes-CurseForge.zip
          python -m zipfile -t dist/Ashes-CurseForge.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Ashes-CurseForge
          path: dist/Ashes-CurseForge.zip
