name: Validate and package CurseForge
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate quest and script files
        run: python tools/build.py
      - name: Validate source
        run: |
          python tools/validate.py
          python tools/audit_mods.py
      - name: Check generated files are committed
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Validate and package
        run: |
          mkdir -p dist
          python tools/package.py dist/Ashes-CurseForge.zip
          python -m zipfile -t dist/Ashes-CurseForge.zip
          python tools/package.py --profile horizons dist/Ashes-Horizons.zip
          python -m zipfile -t dist/Ashes-Horizons.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Ashes-CurseForge
          path: dist/*.zip
      - name: Submit version to CurseForge
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/curseforge-v')
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_UPLOAD_TOKEN: ${{ secrets.CURSEFORGE_UPLOAD_TOKEN }}
        run: python tools/publish_curseforge.py dist/Ashes-CurseForge.zip "$GITHUB_REF_NAME"
